name: mytask

services:
  nginx:
    image: nginx:1.25.3-alpine
    container_name: mytask_nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mytask_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mytask_backend
    environment:
      APP_ENV: local
      APP_URL: http://localhost
      APP_TIMEZONE: America/Sao_Paulo
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: mytask
      DB_USERNAME: root
      DB_PASSWORD: ""
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mytask_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mytask_frontend
    environment:
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    volumes:
      - ./frontend:/var/www/frontend
      - frontend_node_modules:/var/www/frontend/node_modules
    expose:
      - "3000"
    networks:
      - mytask_network

  mysql:
    image: mysql:8.0.36
    container_name: mytask_mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: mytask
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mytask_network

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:

networks:
  mytask_network:
    driver: bridge
