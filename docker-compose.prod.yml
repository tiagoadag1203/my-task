services:
  nginx:
    image: nginx:1.25.3-alpine
    container_name: mytask_nginx_prod
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mytask_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: mytask-backend:prod
    container_name: mytask_backend_prod
    environment:
      APP_ENV: production
      APP_URL: http://localhost
      APP_TIMEZONE: America/Sao_Paulo
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: mytask
      DB_USERNAME: root
      DB_PASSWORD: ""
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mytask_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: mytask-frontend:prod
    container_name: mytask_frontend_prod
    expose:
      - "80"
    networks:
      - mytask_network

  mysql:
    image: mysql:8.0.36
    container_name: mytask_mysql_prod
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: mytask
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mytask_network

volumes:
  mysql_data:

networks:
  mytask_network:
    driver: bridge
