server {
  listen 80;
  server_name _;

  client_max_body_size 32m;

  # Rota da API (comentada até o backend ficar pronto)
  # location /api/ {
  #   fastcgi_pass mytask_backend_prod:9000;
  #   fastcgi_index index.php;
  #   include fastcgi_params;
  #   fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
  #   fastcgi_param SCRIPT_NAME /index.php;
  #   fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
  #   fastcgi_param REQUEST_URI $request_uri;
  # }

  # Rota do Frontend Nuxt 4 (Node Nitro)
  location / {
    proxy_pass http://mytask_frontend_prod:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}